rules:
  # Status
  - field: "status"
    operator: "any"
    value: ["blocked"]
    score: 100
    reason: "Ресурс заблокирован"
  - field: "status"
    operator: "any"
    value: ["pendingDelete", "redemptionPeriod"]
    score: 30
    reason: "Домен в процессе удаления"
  - field: "status"
    operator: "any"
    value: ["serverHold", "clientHold"]
    score: 25
    reason: "Домен удержан регистратором/реестром"
  - field: "status"
    operator: "any"
    value: ["inactive"]
    score: 15
    reason: "Неактивный домен"
  # Geo
  - field: "country"
    operator: "any"
    value: ["RU", "CN", "IR", "KP", "SY", "VE", "NG"]
    score: 5
    reason: "Страна с высоким уровнем киберугроз"
  # DNSsec
  - field: "secureDNS.delegationSigned"
    operator: "equal"
    value: false
    score: 15
    reason: "Отсутствует делегирование DS-записей (нет DNSSEC)"
  - field: "secureDNS.zoneSigned"
    operator: "equal"
    value: false
    score: 15
    reason: "Зона не подписана"
  # - field: "secureDNS.dsData.algorithm"  # dsData is list
  #   operator: "any"
  #   value: [1, 2, 3, 5]
  #   score: 10
  #   reason: "Используется слабый алгоритм DNSSEC (RSA/SHA-1 или старше)"